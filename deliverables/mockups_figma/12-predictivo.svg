<text x="280" y="650" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#52636b">Propuesta: comparar dos modelos con separación temporal de datos. No se declara precisión ni un modelo definitivo.</text>
